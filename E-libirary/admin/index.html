<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Bishop Angelo Tarantino Memorial SS</title>
<style>
  :root { --brand: #14532d; --brand-2: #166534; --line: #e2e8f0; --bg: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: #0f172a; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px;
          box-shadow: 0 6px 24px rgba(15,23,42,.06); max-width: 420px; width: 100%;
          padding: 2rem; }
  
  .logo { text-align: center; font-size: 2.5rem; margin-bottom: 1rem; }
  h1 { color: var(--brand); font-size: 1.4rem; margin: 0 0 .25rem; text-align: center; }
  .sub { color: #64748b; font-size: .9rem; margin: 0 0 1.75rem; text-align: center; }
  
  label { display: block; font-weight: 600; font-size: .85rem; margin: .85rem 0 .35rem; }
  input { width: 100%; padding: .65rem .75rem; border: 1px solid var(--line);
          border-radius: 8px; font: inherit; background: #fff; }
  input:focus { outline: 2px solid var(--brand-2); border-color: var(--brand-2); }
  
  button.submit { margin-top: 1.5rem; width: 100%; padding: .85rem;
                  background: var(--brand); color: #fff; border: 0;
                  border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  button.submit:hover:not(:disabled) { background: var(--brand-2); }
  button.submit:disabled { opacity: .6; cursor: not-allowed; }
  
  .msg { margin-top: 1rem; padding: .75rem 1rem; border-radius: 8px;
         font-size: .88rem; display: none; text-align: center; }
  .msg.ok  { display: block; background: #dcfce7; color: #166534; }
  .msg.err { display: block; background: #fee2e2; color: #991b1b; }
  
  .debug-box {
    background: #f1f5f9; padding: .5rem; border-radius: 6px; font-family: monospace;
    font-size: .8rem; margin-top: .5rem; word-break: break-all; display: none;
  }
  .debug-box.show { display: block; }

  .foot { margin-top: 1.5rem; font-size: .82rem; color: #64748b; text-align: center; }
  .foot a { color: var(--brand); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔐</div>
  <h1>Admin Portal</h1>
  <p class="sub">Sign in to manage the school website.</p>

  <form id="login-form">
    <label>Admin Email</label>
    <input id="email" type="email" required autocomplete="email" placeholder="admin@school.com">

    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password" minlength="6">

    <button class="submit" id="btn" type="submit">Verify & Sign In</button>
    <div class="msg" id="msg"></div>
    <div class="debug-box" id="debug"></div>
  </form>

  <div class="foot">
    <a href="/tarantino/index.html">← Back to Website</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, signInWithEmailAndPassword, signOut 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, doc, getDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUExS9Nka5TfNXjRfjXtc2jwDPaixmfrU",
  authDomain: "e-library-dd680.firebaseapp.com",
  projectId: "e-library-dd680",
  storageBucket: "e-library-dd680.firebasestorage.app",
  messagingSenderId: "960704565735",
  appId: "1:960704565735:web:a1856b2c3e583da559ad42"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const form = document.getElementById("login-form");
const btn  = document.getElementById("btn");
const msg  = document.getElementById("msg");
const debugBox = document.getElementById("debug");

const DASHBOARD_URL = "admin.html"; 

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg " + type;
}

async function verifyAdminRole(user) {
  try {
    // ✅ CORRECTED: Checking the "admins" collection, as per your Security Rules
    const snap = await getDoc(doc(db, "admins", user.uid));
    if (!snap.exists()) return false;
    return snap.data().role === "admin";
  } catch (err) {
    console.error("Error checking admin status:", err);
    return false;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("password").value;

  btn.disabled = true;
  btn.textContent = "Verifying…";
  showMsg("Checking credentials…", "ok");
  debugBox.classList.remove("show");

  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);

    showMsg("Checking admin permissions…", "ok");
    const isAdmin = await verifyAdminRole(cred.user);

    if (isAdmin) {
      showMsg("✅ Access granted. Redirecting…", "ok");
      setTimeout(() => {
        window.location.href = DASHBOARD_URL;
      }, 800);
    } else {
      await signOut(auth);
      showMsg("❌ Access Denied. This account is not an administrator.", "err");
      
      // Debug info exactly matches what we are checking
      debugBox.innerHTML = `Missing Firestore Document.<br><br>Go to Firestore, create a collection named <strong>admins</strong>, and make a document with this exact ID:<br><br><strong>${cred.user.uid}</strong><br><br>Inside it, add field: <strong>role</strong> (string) = <strong>admin</strong>`;
      debugBox.classList.add("show");

      btn.disabled = false;
      btn.textContent = "Verify & Sign In";
    }

  } catch (err) {
    console.error(err);
    showMsg(friendlyError(err.code), "err");
    btn.disabled = false;
    btn.textContent = "Verify & Sign In";
  }
});

function friendlyError(code) {
  switch (code) {
    case "auth/invalid-email":        return "Invalid email format.";
    case "auth/user-not-found":       return "No admin account found with this email.";
    case "auth/wrong-password":
    case "auth/invalid-credential":   return "Incorrect email or password.";
    case "auth/too-many-requests":    return "Too many failed attempts. Try again later.";
    default:                          return "Login failed: " + code;
  }
}
</script>
</body>
</html>
