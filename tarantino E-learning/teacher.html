<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher Dashboard</title>

<style>
  :root {
    --primary: #4a90e2;
    --secondary: #007bff;
    --danger: #dc3545;
    --light: #f5f6fa;
    --white: #fff;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: var(--light);
  }

  header {
    background: var(--primary);
    color: var(--white);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
  }

  .logout-btn {
    background: var(--danger);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }

  nav {
    background: var(--secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
    justify-content: center;
  }

  .nav-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
  }

  section {
    display: none;
    padding: 20px;
    background: white;
    margin: 15px;
    border-radius: 10px;
  }

  section.active {
    display: block;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 8px;
  }

  th {
    background: var(--primary);
    color: white;
  }

  button {
    cursor: pointer;
  }

  .delete-btn {
    background: var(--danger);
    color: white;
    border: none;
    padding: 5px 10px;
  }
</style>
</head>

<body>

<header>
  <h2>Teacher Dashboard</h2>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<nav>
  <button class="nav-btn" data-target="addStudent">Add Student</button>
  <button class="nav-btn" data-target="studentsList">Students</button>
  <button class="nav-btn" data-target="addQuiz">Add Quiz</button>
  <button class="nav-btn" data-target="quizzesList">Quizzes</button>
  <button class="nav-btn" data-target="uploadNotes">Upload Notes</button>
  <button class="nav-btn" data-target="notesList">Notes</button>
</nav>

<main>

<!-- ADD STUDENT -->
<section id="addStudent" class="active">
  <h3>Add Student</h3>
  <form id="studentForm">
    <input id="studentName" placeholder="Name" required>
    <input id="studentEmail" placeholder="Email" required>
    <select id="studentClass" required>
      <option value="">Class</option>
      <option>P1</option><option>P2</option><option>P3</option>
      <option>P4</option><option>P5</option><option>P6</option><option>P7</option>
    </select>
    <button>Add Student</button>
  </form>
</section>

<!-- STUDENTS LIST -->
<section id="studentsList">
  <h3>Students</h3>
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Class</th><th>Action</th></tr></thead>
    <tbody id="studentsTable"></tbody>
  </table>
</section>

<!-- ADD QUIZ -->
<section id="addQuiz">
  <h3>Add Quiz</h3>
  <form id="quizForm">
    <input id="quizTitle" placeholder="Title" required>
    <textarea id="quizDescription" placeholder="Description" required></textarea>
    <input id="quizLink" placeholder="Google Form Link" required>
    <input type="datetime-local" id="openTime" required>
    <input type="datetime-local" id="closeTime" required>
    <button>Add Quiz</button>
  </form>
</section>

<!-- QUIZZES -->
<section id="quizzesList">
  <h3>Quizzes</h3>
  <table>
    <thead><tr><th>Title</th><th>Desc</th><th>Open</th><th>Close</th><th>Action</th></tr></thead>
    <tbody id="quizzesTable"></tbody>
  </table>
</section>

<!-- NOTES -->
<section id="uploadNotes">
  <h3>Upload Notes</h3>
  <form id="notesForm">
    <input id="noteTitle" placeholder="Title" required>
    <input id="noteLink" placeholder="Link" required>
    <button>Upload</button>
  </form>
</section>

<section id="notesList">
  <h3>Notes</h3>
  <table>
    <thead><tr><th>Title</th><th>Link</th><th>Action</th></tr></thead>
    <tbody id="notesTable"></tbody>
  </table>
</section>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDv0wNHZl4wSXd10B7tr9Br-7phWidLDaU",
  authDomain: "tarantino-e-learning.firebaseapp.com",
  projectId: "tarantino-e-learning",
  storageBucket: "tarantino-e-learning.firebasestorage.app",
  messagingSenderId: "501202693775",
  appId: "1:501202693775:web:fabc3af9989542c9a18afa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let teacher = null;

/* NAV */
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
    document.getElementById(btn.dataset.target).classList.add("active");
  }
});

/* AUTH */
onAuthStateChanged(auth, async user=>{
  if(!user){
    location.href="teacher_login.html";
    return;
  }

  teacher = user;

  // create teacher profile if first login
  const ref = doc(db,"teachers",user.uid);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{
      email:user.email,
      createdAt:serverTimestamp()
    });
  }

  loadAll();
});

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async ()=>{
  await signOut(auth);
  location.href="teacher_login.html";
};

/* PATH HELPERS */
const studentsRef = ()=> collection(db,"teachers",teacher.uid,"students");
const quizzesRef  = ()=> collection(db,"teachers",teacher.uid,"quizzes");
const notesRef    = ()=> collection(db,"teachers",teacher.uid,"notes");

/* STUDENTS */
document.getElementById("studentForm").onsubmit = async e=>{
  e.preventDefault();

  await addDoc(studentsRef(),{
    name:studentName.value,
    email:studentEmail.value,
    class:studentClass.value,
    created:serverTimestamp()
  });

  e.target.reset();
  loadStudents();
};

async function loadStudents(){
  const snap = await getDocs(studentsRef());
  studentsTable.innerHTML="";
  snap.forEach(d=>{
    const s=d.data();
    studentsTable.innerHTML+=`
      <tr>
        <td>${s.name}</td>
        <td>${s.email}</td>
        <td>${s.class}</td>
        <td><button class="delete-btn" onclick="delStudent('${d.id}')">X</button></td>
      </tr>`;
  });
}

window.delStudent = async (id)=>{
  await deleteDoc(doc(db,"teachers",teacher.uid,"students",id));
  loadStudents();
};

/* QUIZ */
document.getElementById("quizForm").onsubmit = async e=>{
  e.preventDefault();

  await addDoc(quizzesRef(),{
    title:quizTitle.value,
    description:quizDescription.value,
    link:quizLink.value,
    open:openTime.value,
    close:closeTime.value,
    created:serverTimestamp()
  });

  e.target.reset();
  loadQuizzes();
};

async function loadQuizzes(){
  const snap = await getDocs(quizzesRef());
  quizzesTable.innerHTML="";
  snap.forEach(d=>{
    const q=d.data();
    quizzesTable.innerHTML+=`
      <tr>
        <td>${q.title}</td>
        <td>${q.description}</td>
        <td>${q.open}</td>
        <td>${q.close}</td>
        <td><button class="delete-btn" onclick="delQuiz('${d.id}')">X</button></td>
      </tr>`;
  });
}

window.delQuiz = async id=>{
  await deleteDoc(doc(db,"teachers",teacher.uid,"quizzes",id));
  loadQuizzes();
};

/* NOTES */
document.getElementById("notesForm").onsubmit = async e=>{
  e.preventDefault();

  await addDoc(notesRef(),{
    title:noteTitle.value,
    link:noteLink.value,
    created:serverTimestamp()
  });

  e.target.reset();
  loadNotes();
};

async function loadNotes(){
  const snap = await getDocs(notesRef());
  notesTable.innerHTML="";
  snap.forEach(d=>{
    const n=d.data();
    notesTable.innerHTML+=`
      <tr>
        <td>${n.title}</td>
        <td><a href="${n.link}" target="_blank">Open</a></td>
        <td><button class="delete-btn" onclick="delNote('${d.id}')">X</button></td>
      </tr>`;
  });
}

window.delNote = async id=>{
  await deleteDoc(doc(db,"teachers",teacher.uid,"notes",id));
  loadNotes();
};

/* LOAD ALL */
function loadAll(){
  loadStudents();
  loadQuizzes();
  loadNotes();
}
</script>

</body>
</html>
