<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard</title>
  <style>
    :root {
      --primary: #007bff;
      --secondary: #28a745;
      --accent: #ffc107;
      --danger: #dc3545;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h2 { margin-bottom: 5px; }
    #studentName { font-size: 16px; color: #555; margin-bottom: 20px; }

    /* ---------- NAV BUTTONS ---------- */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    nav button {
      flex: 1 1 150px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 15px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: var(--shadow);
    }

    nav button:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }

    nav button.active {
      background: var(--secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
      }
      nav button {
        flex: 1 1 45%;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      nav {
        flex-direction: column;
      }
      nav button {
        width: 100%;
        font-size: 0.9rem;
      }
    }

    /* ---------- SECTIONS ---------- */
    section { display: none; }
    section.active { display: block; }

    input[type="text"], select {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    #quizList, #notesList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .quiz-card, .note-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      width: 320px;
      transition: 0.3s;
      opacity: 0;
      animation: fadeIn 0.5s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    h3 { color: var(--primary); margin-bottom: 5px; }
    p { margin: 5px 0; }

    button.quiz-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 5px;
    }

    button.quiz-btn:hover { background: #0056b3; }

    .active-quiz { background: #e8f5e9; border-left: 5px solid var(--secondary); }
    .upcoming { background: #fff5cc; border-left: 5px solid var(--accent); }
    .expired { background: #ffe6e6; border-left: 5px solid var(--danger); }

    iframe {
      border-radius: 8px;
      margin-top: 8px;
    }

    #logoutBtn {
      margin-top: 30px;
      background: var(--danger);
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #logoutBtn:hover { background: #b02a37; }
  </style>
</head>
<body>
  <h2>Welcome Student</h2>
  <div id="studentName"></div>

  <!-- NAV BUTTONS -->
  <nav>
    <button class="nav-btn active" data-target="quizzesSection">🧩 Quizzes</button>
    <button class="nav-btn" data-target="notesSection">📚 Notes & Tutorials</button>
  </nav>

  <!-- QUIZZES SECTION -->
  <section id="quizzesSection" class="active">
    <h3>🧩 Available Quizzes</h3>
    <input type="text" id="searchInput" placeholder="Search quizzes by title...">
    <select id="statusFilter">
      <option value="current">Current & Upcoming</option>
      <option value="expired">Expired Only</option>
      <option value="all">All Quizzes</option>
    </select>
    <div id="quizList"></div>
  </section>

  <!-- NOTES SECTION -->
  <section id="notesSection">
    <h3>📚 Notes & Tutorials</h3>
    <input type="text" id="searchNotes" placeholder="Search notes by title...">
    <div id="notesList"></div>
  </section>

  <button id="logoutBtn">Logout</button>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
  getAuth,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDv0wNHZl4wSXd10B7tr9Br-7phWidLDaU",
  authDomain: "tarantino-e-learning.firebaseapp.com",
  projectId: "tarantino-e-learning",
  storageBucket: "tarantino-e-learning.firebasestorage.app",
  messagingSenderId: "501202693775",
  appId: "1:501202693775:web:fabc3af9989542c9a18afa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const quizList = document.getElementById("quizList");
const notesList = document.getElementById("notesList");
const logoutBtn = document.getElementById("logoutBtn");
const filterSelect = document.getElementById("statusFilter");
const searchInput = document.getElementById("searchInput");
const searchNotes = document.getElementById("searchNotes");
const studentNameDiv = document.getElementById("studentName");

let allQuizzes = [];
let allNotes = [];
let teacherIds = [];

/* -------------------------------- */
/* FIND TEACHERS WHO ADDED STUDENT */
/* -------------------------------- */

async function getStudentTeachers(studentEmail) {

  const teachersSnap = await getDocs(
    collection(db, "teachers")
  );

  const teachers = [];

  for (const teacherDoc of teachersSnap.docs) {

    const studentsSnap = await getDocs(
      collection(
        db,
        "teachers",
        teacherDoc.id,
        "students"
      )
    );

    const found = studentsSnap.docs.find(
      s =>
        s.data().email &&
        s.data().email.toLowerCase() ===
        studentEmail.toLowerCase()
    );

    if (found) {
      teachers.push(teacherDoc.id);
    }
  }

  return teachers;
}

/* ------------------ */
/* AUTH CHECK */
/* ------------------ */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "student-login.html";
    return;
  }

  studentNameDiv.textContent =
    `Logged in as: ${user.displayName || user.email}`;

  teacherIds = await getStudentTeachers(user.email);

  if (teacherIds.length === 0) {

    quizList.innerHTML = `
      <p>
        No teacher has added you yet.
      </p>
    `;

    notesList.innerHTML = `
      <p>
        No teacher has added you yet.
      </p>
    `;

    return;
  }

  await loadQuizzes();
  await loadNotes();

  setInterval(async () => {
    await loadQuizzes();
  }, 30000);
});

/* ------------------ */
/* LOAD QUIZZES */
/* ------------------ */

async function loadQuizzes() {

  const now = new Date();

  allQuizzes = [];

  for (const teacherId of teacherIds) {

    const snapshot = await getDocs(
      collection(
        db,
        "teachers",
        teacherId,
        "quizzes"
      )
    );

    snapshot.forEach(docSnap => {

      const q = docSnap.data();

      const start = q.open
        ? new Date(q.open)
        : new Date();

      const end = q.close
        ? new Date(q.close)
        : new Date();

      const status =
        now < start
          ? "upcoming"
          : now > end
          ? "expired"
          : "active-quiz";

      allQuizzes.push({
        id: docSnap.id,
        ...q,
        start,
        end,
        status
      });

    });
  }

  renderQuizzes();
}

/* ------------------ */
/* RENDER QUIZZES */
/* ------------------ */

function renderQuizzes() {

  quizList.innerHTML = "";

  const filter = filterSelect.value;
  const searchTerm = searchInput.value.toLowerCase();

  const filtered = allQuizzes.filter(q => {

    const matchesFilter =
      filter === "current"
        ? q.status === "active-quiz" ||
          q.status === "upcoming"
        : filter === "expired"
        ? q.status === "expired"
        : true;

    const matchesSearch =
      (q.title || "")
      .toLowerCase()
      .includes(searchTerm);

    return matchesFilter && matchesSearch;
  });

  if (filtered.length === 0) {
    quizList.innerHTML =
      "<p>No quizzes found.</p>";
    return;
  }

  filtered.forEach(q => {

    const div = document.createElement("div");

    div.classList.add(
      "quiz-card",
      q.status
    );

    const statusText =
      q.status === "active-quiz"
        ? "🟢 Open now"
        : q.status === "upcoming"
        ? "🕒 Not yet open"
        : "🔴 Closed";

    const buttonLabel =
      q.status === "expired"
        ? "View Quiz"
        : q.status === "upcoming"
        ? "Wait to Open"
        : "Open Quiz";

    div.innerHTML = `
      <h3>${q.title || ""}</h3>
      <p>${q.description || ""}</p>

      <p>
        <strong>Open:</strong>
        ${q.start.toLocaleString()}
      </p>

      <p>
        <strong>Close:</strong>
        ${q.end.toLocaleString()}
      </p>

      <p>
        <strong>Status:</strong>
        ${statusText}
      </p>

      <button class="quiz-btn">
        ${buttonLabel}
      </button>
    `;

    div.querySelector(".quiz-btn")
      .addEventListener("click", () => {

        if (q.status === "upcoming") {
          alert(
            "This quiz is not open yet."
          );
          return;
        }

        if (q.link) {
          window.open(
            q.link,
            "_blank"
          );
        }

      });

    quizList.appendChild(div);

  });
}

filterSelect.addEventListener(
  "change",
  renderQuizzes
);

searchInput.addEventListener(
  "input",
  renderQuizzes
);

/* ------------------ */
/* LOAD NOTES */
/* ------------------ */

async function loadNotes() {

  allNotes = [];

  for (const teacherId of teacherIds) {

    const snapshot = await getDocs(
      collection(
        db,
        "teachers",
        teacherId,
        "notes"
      )
    );

    snapshot.forEach(docSnap => {

      allNotes.push({
        id: docSnap.id,
        ...docSnap.data()
      });

    });
  }

  renderNotes();
}

/* ------------------ */
/* RENDER NOTES */
/* ------------------ */

function renderNotes() {

  notesList.innerHTML = "";

  const searchTerm =
    searchNotes.value.toLowerCase();

  const filtered =
    allNotes.filter(note =>
      (note.title || "")
      .toLowerCase()
      .includes(searchTerm)
    );

  if (filtered.length === 0) {

    notesList.innerHTML =
      "<p>No notes found.</p>";

    return;
  }

  filtered.forEach(note => {

    const div =
      document.createElement("div");

    div.classList.add("note-card");

    div.innerHTML = `
      <h3>${note.title || ""}</h3>

      <p>
        <a
          href="${note.link}"
          target="_blank"
        >
          Open Note
        </a>
      </p>
    `;

    notesList.appendChild(div);
  });
}

searchNotes.addEventListener(
  "input",
  renderNotes
);

/* ------------------ */
/* NAVIGATION */
/* ------------------ */

const navButtons =
  document.querySelectorAll(".nav-btn");

const sections =
  document.querySelectorAll("section");

navButtons.forEach(btn => {

  btn.addEventListener("click", () => {

    navButtons.forEach(b =>
      b.classList.remove("active")
    );

    btn.classList.add("active");

    const target =
      btn.dataset.target;

    sections.forEach(s =>
      s.classList.remove("active")
    );

    document
      .getElementById(target)
      .classList.add("active");

  });

});

/* ------------------ */
/* LOGOUT */
/* ------------------ */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

    window.location.href =
      "student-login.html";

  }
);
  </script>
</body>
</html>
