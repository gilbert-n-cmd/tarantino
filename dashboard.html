<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Student Portal</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <header class="portal-header">
    <div class="portal-brand">🎓 Tarantino Portal</div>
    <nav class="portal-nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="grades.html">Grades</a>
      <a href="fees.html">Fees</a>
      <a href="timetable.html">Timetable</a>
      <a href="messages.html">Messages</a>
      <button id="portalLogout">Logout</button>
    </nav>
  </header>

  <main class="portal-content">
    <h1>Welcome, <span id="studentName">…</span></h1>
    <p class="portal-sub">Class: <span id="studentClass">…</span> | House: <span id="studentHouse">…</span></p>

    <div class="dashboard-grid">
      <div class="dash-card">
        <h3>📊 Latest Grade</h3>
        <p id="latestGrade">Loading…</p>
      </div>
      <div class="dash-card">
        <h3>💰 Fee Balance</h3>
        <p id="feeBalance">Loading…</p>
      </div>
      <div class="dash-card">
        <h3>✉️ Unread Messages</h3>
        <p id="unreadMsgs">Loading…</p>
      </div>
      <div class="dash-card">
        <h3>📅 Enrolled</h3>
        <p id="enrolledAt">Loading…</p>
      </div>
    </div>
  </main>

  <script src="../firebase-config.js"></script>
  <script type="module" src="../ai-auth.js"></script>
  <script type="module" src="../firestore-data.js"></script>
  <script type="module" src="../portal.js"></script>
</body>
</html>
