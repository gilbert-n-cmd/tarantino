<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grades — Student Portal</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <header class="portal-header">
    <div class="portal-brand">🎓 Tarantino Portal</div>
    <nav class="portal-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="grades.html" class="active">Grades</a>
      <a href="fees.html">Fees</a>
      <a href="timetable.html">Timetable</a>
      <a href="messages.html">Messages</a>
      <button id="portalLogout">Logout</button>
    </nav>
  </header>

  <main class="portal-content">
    <h1>My Grades</h1>
    <p class="portal-sub">All your exam and term results</p>

    <div id="gradesLoading" class="portal-loading">Loading grades…</div>
    <div id="gradesEmpty" class="portal-empty" style="display:none">
      No grades recorded yet. Check back after the next exam.
    </div>

    <div id="gradesList" class="grades-list"></div>
  </main>

  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/ai-auth.js"></script>
  <script type="module" src="../js/firestore-data.js"></script>
  <script type="module" src="../js/portal.js"></script>
</body>
</html>
