<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fees — Student Portal</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <header class="portal-header">
    <div class="portal-brand">🎓 Tarantino Portal</div>
    <nav class="portal-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="grades.html">Grades</a>
      <a href="fees.html" class="active">Fees</a>
      <a href="timetable.html">Timetable</a>
      <a href="messages.html">Messages</a>
      <button id="portalLogout">Logout</button>
    </nav>
  </header>

  <main class="portal-content">
    <h1>Fee Status</h1>
    <p class="portal-sub">Your payment history and current balance</p>

    <div id="feeSummary" class="fee-summary"></div>

    <div id="feesLoading" class="portal-loading">Loading fee records…</div>
    <div id="feesEmpty" class="portal-empty" style="display:none">
      No fee records available. Contact the school bursar.
    </div>

    <div id="feesList" class="fees-list"></div>
  </main>

  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/ai-auth.js"></script>
  <script type="module" src="../js/firestore-data.js"></script>
  <script type="module" src="../js/portal.js"></script>
</body>
</html>
