<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Tarantino Portal</title>
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body>
  <main class="portal-login">
    <div class="login-card admin-login-card">
      <div class="login-badge">🛠️</div>
      <h1>Admin Login</h1>
      <p class="login-sub">Restricted access — staff only</p>

      <form id="adminLoginForm">
        <label>
          Admin Email
          <input type="email" id="adminEmail" required autocomplete="email" placeholder="admin@school.com">
        </label>

        <label>
          Password
          <input type="password" id="adminPassword" required minlength="6" autocomplete="current-password">
        </label>

        <button type="submit" id="adminLoginBtn">Sign In as Admin</button>

        <p class="portal-error" id="adminError"></p>
      </form>

      <p class="portal-help">
        Not an admin? <a href="login.html">Student login →</a>
      </p>

      <p class="portal-help">
        <a href="admi.html">← Back to main site</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
