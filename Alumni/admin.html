<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Alumni Registration</title>
<style>
  :root { --brand: #004080; --line: #e2e8f0; --bg: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #0f172a; padding: 2rem 1rem; }
  .wrap { max-width: 1000px; margin: 0 auto 1.5rem; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 2rem; box-shadow: 0 6px 24px rgba(15,23,42,.06); }
  h1 { margin: 0 0 .25rem; font-size: 1.5rem; color: var(--brand); }
  .sub { margin: 0 0 1.5rem; color: #64748b; font-size: .9rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
  input { width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { padding: .65rem 1.1rem; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; background: var(--brand); color: #fff; }
  button:hover:not(:disabled) { background: #00325f; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .msg { margin-top: 1rem; padding: .8rem 1rem; border-radius: 8px; font-size: .9rem; display: none; }
  .msg.ok { display: block; background: #dcfce7; color: #166534; }
  .msg.err { display: block; background: #fee2e2; color: #991b1b; }
  .msg.info { display: block; background: #dbeafe; color: #1e40af; }
  
  #login-panel { max-width: 460px; margin: 4rem auto; }
  #admin-panel { display: none; }
  
  .table-wrap { overflow-x: auto; margin-top: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); }
  th { background: #f1f5f9; font-weight: 600; }
  .pill { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 600; }
  .pill.admin { background: #dbeafe; color: #1e40af; }
</style>
</head>
<body>

<!-- LOGIN PANEL -->
<div id="login-panel" class="wrap">
  <h1>Admin Login</h1>
  <p class="sub">Sign in with your administrator account.</p>
  <form id="login-form">
    <label for="login_email">Email</label>
    <input id="login_email" type="email" required>
    <label for="login_password" style="margin-top:.75rem;">Password</label>
    <input id="login_password" type="password" required>
    <button type="submit" id="login-btn" style="margin-top:1rem; width:100%;">Sign in</button>
    <div class="msg" id="login-msg"></div>
  </form>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel" class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <div>
      <h1 style="margin:0;">Admin Panel</h1>
      <p class="sub" style="margin:0;">Signed in as <b id="admin-email"></b> · <span class="pill admin">admin</span></p>
    </div>
    <button id="logout-btn" style="background:#64748b;">Log out</button>
  </div>
  <div id="msg" class="msg"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" style="text-align:center;">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ─── Catch ALL errors and print them to the screen ───
window.addEventListener("error", (e) => {
  document.body.innerHTML += `<div style="background:red; color:white; padding:1rem; margin:1rem; border-radius:8px;">
    <b>Fatal Error:</b> ${e.message}<br><small>Check the browser console for details.</small>
  </div>`;
});

const firebaseConfig = {
  apiKey:            "AIzaSyCVJT7FQcfX9OWf-HgD2Xd_M_hBp0v1Pf0",
  authDomain:        "alumni-74176.firebaseapp.com",
  projectId:         "alumni-74176",
  storageBucket:     "alumni-74176.firebasestorage.app",
  messagingSenderId: "952137152614",
  appId:             "1:952137152614:web:d9c5aea4643fcc585915a7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginPanel = document.getElementById("login-panel");
const loginForm = document.getElementById("login-form");
const loginMsg = document.getElementById("login-msg");
const loginBtn = document.getElementById("login-btn");
const adminPanel = document.getElementById("admin-panel");
const adminEmailEl = document.getElementById("admin-email");
const logoutBtn = document.getElementById("logout-btn");
const rows = document.getElementById("rows");
const msg = document.getElementById("msg");

function loginShow(text, type) { loginMsg.textContent = text; loginMsg.className = "msg " + type; }
function show(text, type) { msg.textContent = text; msg.className = "msg " + type; }

// ═══════════════════════════════════════════════════════
//  AUTH STATE (With 3s timeout)
// ═══════════════════════════════════════════════════════
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    loginPanel.style.display = "block";
    adminPanel.style.display = "none";
    loginBtn.disabled = false;
    loginMsg.textContent = "";
    return;
  }

  loginShow("Verifying access...", "info");
  loginBtn.disabled = true;

  try {
    // Wrap the read in a 3-second timeout so it doesn't hang forever
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Firestore Timeout")), 3000));
    const rolePromise = getDoc(doc(db, "roles", user.uid));
    
    const snap = await Promise.race([rolePromise, timeout]);

    if (!snap.exists() || snap.data().role !== "admin") {
      loginShow("You are logged in, but you are not an admin. Check the 'roles' collection in Firestore.", "err");
      await signOut(auth);
      return;
    }

    // Success!
    loginPanel.style.display = "none";
    adminPanel.style.display = "block";
    adminEmailEl.textContent = user.email;
    loadData();

  } catch (err) {
    console.error(err);
    loginShow("Error: " + err.message, "err");
    await signOut(auth);
  }
});

// ═══════════════════════════════════════════════════════
//  LOGIN SUBMIT
// ═══════════════════════════════════════════════════════
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginShow("Signing in...", "info");
  
  const email = document.getElementById("login_email").value.trim();
  const pass = document.getElementById("login_password").value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    // Note: The onAuthStateChanged block above will handle the rest.
  } catch (err) {
    console.error(err);
    loginShow("Error: " + err.message, "err");
    loginBtn.disabled = false;
  }
});

logoutBtn.addEventListener("click", () => signOut(auth));

// ═══════════════════════════════════════════════════════
//  LOAD DATA
// ═══════════════════════════════════════════════════════
async function loadData() {
  rows.innerHTML = '<tr><td colspan="3" style="text-align:center;">Loading...</td></tr>';
  try {
    const snap = await getDocs(collection(db, "alumni"));
    if (snap.empty) {
      rows.innerHTML = '<tr><td colspan="3" style="text-align:center;">No alumni found.</td></tr>';
      return;
    }
    
    let html = "";
    snap.forEach(d => {
      const data = d.data();
      html += `<tr>
        <td>${data.full_name || "Unknown"}</td>
        <td>${data.email || "No email"}</td>
        <td>${data.approved ? "Approved" : "Pending"}</td>
      </tr>`;
    });
    rows.innerHTML = html;
  } catch (err) {
    console.error(err);
    show("Failed to load data: " + err.message, "err");
  }
}
</script>
</body>
</html>
