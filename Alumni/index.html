<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alumni Registration — Bishop Angelo Tarantino Memorial SS</title>
<style>
  :root { --brand: #14532d; --brand-2: #166534; --bg: #f8fafc; --line: #e2e8f0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: #0f172a; padding: 2rem 1rem; }
  .wrap { max-width: 720px; margin: 0 auto 1.5rem; background: #fff; border: 1px solid var(--line);
          border-radius: 14px; padding: 2rem; box-shadow: 0 6px 24px rgba(15,23,42,.06); }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; color: #004080; }
  h2 { margin: 0 0 1rem; font-size: 1.25rem; color: #004080; }
  .sub { margin: 0 0 1.75rem; color: #64748b; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
  input, select, textarea {
    width: 100%; padding: .65rem .75rem; border: 1px solid var(--line);
    border-radius: 8px; font: inherit; background: #fff; color: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--brand-2); outline-offset: 1px; border-color: var(--brand-2);
  }
  textarea { resize: vertical; min-height: 96px; }
  .req { color: #dc2626; }
  .check { display: flex; gap: .6rem; align-items: flex-start; font-weight: 400; font-size: .9rem; }
  .check input { width: auto; margin-top: .2rem; }
  .hp { position: absolute; left: -9999px; }
  button {
    margin-top: 1.5rem; width: 100%; padding: .85rem; border: 0; border-radius: 8px;
    background: #004080; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--brand-2); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 1rem; padding: .8rem 1rem; border-radius: 8px; font-size: .9rem; display: none; }
  .msg.ok  { display: block; background: #dcfce7; color: #166534; }
  .msg.err { display: block; background: #fee2e2; color: #991b1b; }
  .msg.info{ display: block; background: #dbeafe; color: #1e40af; }

  /* Directory styles */
  .directory { margin-top: 1.5rem; }
  .directory-toolbar { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .directory-toolbar input { flex: 1; min-width: 180px; }
  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
  .member-card {
    border: 1px solid var(--line); border-radius: 10px; padding: 1rem; background: #fbfdff;
    display: flex; flex-direction: column; gap: .35rem;
  }
  .member-card h3 { margin: 0; font-size: 1.05rem; color: #0f172a; }
  .member-card .meta { font-size: .82rem; color: #475569; }
  .member-card .courses { font-size: .85rem; color: #0f172a; }
  .member-card .courses span.label { font-weight: 600; color: #166534; }
  .member-card .bio { font-size: .82rem; color: #64748b; margin-top: .35rem; }
  .member-card .contact { font-size: .8rem; color: #0f172a; margin-top: .25rem; word-break: break-word; }
  .empty { color: #64748b; font-size: .9rem; padding: 1rem 0; }
  .count { font-size: .85rem; color: #64748b; margin-bottom: .5rem; }

  /* Login form */
  .login-box { display: none; }
  .login-box.active { display: block; }
  .login-row { display: flex; gap: .75rem; flex-wrap: wrap; }
  .login-row > div { flex: 1; min-width: 180px; }
  .whoami { font-size: .85rem; color: #166534; margin-bottom: .75rem; display: none; }
  .whoami.active { display: block; }
  .btn-secondary { background: #64748b; }
  .btn-secondary:hover:not(:disabled) { background: #475569; }
  .btn-row { display: flex; gap: .75rem; flex-wrap: wrap; }
  .btn-row button { flex: 1; min-width: 140px; }

  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .wrap { padding: 1.25rem; } }
</style>
</head>
<body>

<!-- ══════════ REGISTRATION FORM ══════════ -->
<div class="wrap">
  <h1>Alumni Registration</h1>
  <p class="sub">Bishop Angelo Tarantino Memorial Secondary School — Primus Inter Pares</p>

  <form id="alumni-form" novalidate>
    <div class="grid">
      <div class="full">
        <label for="full_name">Full name <span class="req">*</span></label>
        <input id="full_name" name="full_name" required maxlength="120" autocomplete="name">
      </div>

      <div>
        <label for="graduation_year">Year of graduation</label>
        <input id="graduation_year" name="graduation_year" type="number" min="1950" max="2100" placeholder="e.g. 2015">
      </div>

      <div>
        <label for="class_stream">Class / Stream</label>
        <input id="class_stream" name="class_stream" maxlength="60" placeholder="e.g. S6 Sciences">
      </div>

      <div class="full">
        <label for="courses">Course(s) pursued <span class="req">*</span></label>
        <input id="courses" name="courses" required maxlength="200" placeholder="e.g. BSc Computer Science, MBA">
        <small style="color:#64748b; font-size:.78rem;">Separate multiple courses with commas.</small>
      </div>

      <div>
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <small style="color:#64748b; font-size:.78rem;">Approval credentials will be sent here.</small>
      </div>

      <div>
        <label for="phone">Phone <span class="req">*</span></label>
        <input id="phone" name="phone" required type="tel" maxlength="20" autocomplete="tel">
      </div>

      <div>
        <label for="occupation">Occupation</label>
        <input id="occupation" name="occupation" maxlength="80">
      </div>

      <div>
        <label for="employer">Employer / Organisation</label>
        <input id="employer" name="employer" maxlength="80">
      </div>

      <div>
        <label for="location">Location</label>
        <input id="location" name="location" maxlength="80" placeholder="City, Country">
      </div>

      <div>
        <label for="linkedin">LinkedIn / Website</label>
        <input id="linkedin" name="linkedin" type="url" maxlength="200" placeholder="https://">
      </div>

      <div class="full">
        <label for="bio">Short bio</label>
        <textarea id="bio" name="bio" maxlength="500" placeholder="Tell us what you've been up to since school."></textarea>
      </div>

      <div class="full check">
        <input id="consent_public" name="consent_public" type="checkbox" checked>
        <label for="consent_public">
          I agree to have my name, graduation year, courses and occupation shown in the public alumni directory.
        </label>
      </div>

      <div class="full check">
        <input id="share_location" name="share_location" type="checkbox">
        <label for="share_location">
          Share my live location with the school administration (e.g., for alumni events).
        </label>
      </div>

      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="submit-btn">Submit registration</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
</div>

<!-- ══════════ ALUMNI DIRECTORY (login-gated) ══════════ -->
<div class="wrap directory">
  <h2>Alumni Directory</h2>
  <p class="sub">Restricted to approved alumni. Use the credentials sent to you by email.</p>

  <!-- Login form -->
  <div id="login-box" class="login-box active">
    <form id="login-form" novalidate>
      <div class="login-row">
        <div>
          <label for="login_email">Email</label>
          <input id="login_email" type="email" required autocomplete="username">
        </div>
        <div>
          <label for="login_password">Password</label>
          <input id="login_password" type="password" required autocomplete="current-password">
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" id="login-btn">Log in</button>
        <button type="button" id="logout-btn" class="btn-secondary" style="display:none;">Log out</button>
      </div>
      <div class="msg" id="login-msg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <!-- Directory content (shown after login) -->
  <div id="directory-content" style="display:none;">
    <div id="whoami" class="whoami"></div>

    <div class="directory-toolbar">
      <input id="search" placeholder="Search by name, course, occupation, year…">
      <button type="button" id="refresh-btn" style="width:auto; margin-top:0; padding:.65rem 1rem;">Refresh</button>
    </div>

    <div class="count" id="dir-count"></div>
    <div id="member-grid" class="member-grid"></div>
    <div class="msg" id="dir-msg" role="status" aria-live="polite"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, getDoc, query, where, getDocs,
  serverTimestamp, GeoPoint, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCVJT7FQcfX9OWf-HgD2Xd_M_hBp0v1Pf0",
  authDomain:        "alumni-74176.firebaseapp.com",
  projectId:         "alumni-74176",
  storageBucket:     "alumni-74176.firebasestorage.app",
  messagingSenderId: "952137152614",
  appId:             "1:952137152614:web:d9c5aea4643fcc585915a7"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ─── UI elements ───
const form      = document.getElementById("alumni-form");
const btn       = document.getElementById("submit-btn");
const msg       = document.getElementById("msg");
const gotcha    = form.querySelector('input[name="_gotcha"]');

const loginBox     = document.getElementById("login-box");
const loginForm    = document.getElementById("login-form");
const loginEmail   = document.getElementById("login_email");
const loginPassword= document.getElementById("login_password");
const loginBtn     = document.getElementById("login-btn");
const logoutBtn    = document.getElementById("logout-btn");
const loginMsg     = document.getElementById("login-msg");

const directoryContent = document.getElementById("directory-content");
const whoami       = document.getElementById("whoami");
const memberGrid   = document.getElementById("member-grid");
const dirCount     = document.getElementById("dir-count");
const dirMsg       = document.getElementById("dir-msg");
const searchInput  = document.getElementById("search");
const refreshBtn   = document.getElementById("refresh-btn");

let allMembers = [];

function show(text, type) { msg.textContent = text; msg.className = "msg " + type; }
function loginShow(text, type) { loginMsg.textContent = text; loginMsg.className = "msg " + type; }
function dirShow(text, type) { dirMsg.textContent = text; dirMsg.className = "msg " + type; }

// ════════════════════════════════════════════════════════════════
//  REGISTRATION — Fetches GPS if checkbox is ticked
// ════════════════════════════════════════════════════════════════
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (gotcha.value) return;

  if (!form.full_name.value.trim()) return show("Please enter your full name.", "err");
  if (!form.courses.value.trim())   return show("Please enter your course(s).", "err");
  if (!form.email.checkValidity())  return show("Please enter a valid email.", "err");
  if (!form.phone.value.trim())     return show("Please enter your phone number.", "err");
  if (!form.consent_public.checked) return show("Please tick the directory consent box.", "err");

  const year = form.graduation_year.value ? Number(form.graduation_year.value) : null;
  const shareLocation = form.share_location.checked;

  const data = {
    full_name:       form.full_name.value.trim(),
    graduation_year: year,
    class_stream:    form.class_stream.value.trim(),
    courses:         form.courses.value.trim(),
    email:           form.email.value.trim().toLowerCase(),
    phone:           form.phone.value.trim(),
    occupation:      form.occupation.value.trim(),
    employer:        form.employer.value.trim(),
    location:        form.location.value.trim(),
    linkedin:        form.linkedin.value.trim(),
    bio:             form.bio.value.trim(),
    consent_public:  form.consent_public.checked,
    share_location:  shareLocation,
    approved:        false,
    created_at:      serverTimestamp(),
    live_location:   null, // Will be set if they share
  };

  btn.disabled = true;
  btn.textContent = "Submitting…";
  show("Submitting registration…", "info");

  // ⭐ NEW: Fetch GPS coordinates if they checked the box
  if (shareLocation && navigator.geolocation) {
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000 });
      });
      data.live_location = new GeoPoint(pos.coords.latitude, pos.coords.longitude);
    } catch (err) {
      console.warn("Geolocation failed or denied:", err);
      // We don't block registration, just proceed without coords
    }
  }

  try {
    await addDoc(collection(db, "alumni"), data);
    show("Registration submitted! You'll receive login credentials by email once approved.", "ok");
    form.reset();
  } catch (err) {
    console.error(err);
    show("Error saving: " + err.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "Submit registration";
  }
});

// ════════════════════════════════════════════════════════════════
//  LOGIN — credentials issued by admin after approval
// ════════════════════════════════════════════════════════════════
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!loginEmail.value.trim() || !loginPassword.value) {
    return loginShow("Enter your email and password.", "err");
  }
  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in…";
  loginShow("Signing in…", "info");
  try {
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
    loginShow("Logged in.", "ok");
    loginPassword.value = "";
  } catch (err) {
    console.error(err);
    let m = "Login failed.";
    if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
      m = "Incorrect email or password.";
    } else if (err.code === "auth/too-many-requests") {
      m = "Too many attempts. Try again later.";
    }
    loginShow(m, "err");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Log in";
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  loginShow("Logged out.", "info");
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    loginBox.classList.add("active");
    directoryContent.style.display = "none";
    logoutBtn.style.display = "none";
    allMembers = [];
    memberGrid.innerHTML = "";
    dirCount.textContent = "";
    whoami.textContent = "";
    whoami.classList.remove("active");
    return;
  }

  loginBox.classList.remove("active");
  loginMsg.className = "msg";
  loginMsg.textContent = "";

  try {
    const q = query(collection(db, "alumni"),
      where("email", "==", user.email.toLowerCase()),
      where("approved", "==", true));
    const snap = await getDocs(q);

    if (snap.empty) {
      await signOut(auth);
      loginBox.classList.add("active");
      loginShow("This account is not approved yet. Please contact the school admin.", "err");
      return;
    }

    const myDoc = snap.docs[0].data();
    whoami.textContent = `Logged in as ${myDoc.full_name || user.email}`;
    whoami.classList.add("active");

    directoryContent.style.display = "block";
    logoutBtn.style.display = "inline-block";

    await loadDirectory();
  } catch (err) {
    console.error(err);
    loginShow("Could not verify approval: " + err.message, "err");
    await signOut(auth);
  }
});

// ════════════════════════════════════════════════════════════════
//  DIRECTORY — visible only to approved, logged-in alumni
// ════════════════════════════════════════════════════════════════
async function loadDirectory() {
  memberGrid.innerHTML = '<div class="empty">Loading alumni…</div>';
  dirShow("", "");
  try {
    const q = query(collection(db, "alumni"),
      where("approved", "==", true),
      where("consent_public", "==", true));
    const snap = await getDocs(q);
    allMembers = [];
    snap.forEach((d) => {
      const data = d.data();
      if (data.full_name) allMembers.push({ id: d.id, ...data });
    });

    allMembers.sort((a, b) => {
      const ya = a.graduation_year || 0, yb = b.graduation_year || 0;
      if (yb !== ya) return yb - ya;
      return (a.full_name || "").localeCompare(b.full_name || "");
    });

    renderDirectory();
  } catch (err) {
    console.error("Directory load failed:", err);
    memberGrid.innerHTML = "";
    dirShow("Could not load directory: " + err.message, "err");
  }
}

function renderDirectory() {
  const term = searchInput.value.trim().toLowerCase();
  const filtered = allMembers.filter((m) => {
    if (!term) return true;
    return [m.full_name, m.courses, m.occupation, m.employer, m.location, m.graduation_year]
      .filter(Boolean)
      .some((v) => String(v).toLowerCase().includes(term));
  });

  dirCount.textContent = `${filtered.length} of ${allMembers.length} alumni shown`;

  if (filtered.length === 0) {
    memberGrid.innerHTML = '<div class="empty">No alumni match your search.</div>';
    return;
  }

  memberGrid.innerHTML = filtered.map((m) => {
    const year = m.graduation_year ? `Class of ${m.graduation_year}` : "Graduation year not set";
    const stream = m.class_stream ? ` • ${escapeHtml(m.class_stream)}` : "";
    const occ = m.occupation
      ? `<div class="meta">${escapeHtml(m.occupation)}${m.employer ? " — " + escapeHtml(m.employer) : ""}</div>`
      : "";
    const loc = m.location ? `<div class="meta">📍 ${escapeHtml(m.location)}</div>` : "";
    const courses = m.courses
      ? `<div class="courses"><span class="label">Course(s):</span> ${escapeHtml(m.courses)}</div>`
      : `<div class="courses" style="color:#94a3b8;">Course(s) not provided</div>`;
    const bio = m.bio ? `<div class="bio">${escapeHtml(m.bio)}</div>` : "";
    const contact = [
      m.email ? `<div class="contact">✉️ ${escapeHtml(m.email)}</div>` : "",
      m.phone ? `<div class="contact">📞 ${escapeHtml(m.phone)}</div>` : "",
      m.linkedin ? `<div class="contact">🔗 <a href="${escapeAttr(m.linkedin)}" target="_blank" rel="noopener">${escapeHtml(m.linkedin)}</a></div>` : ""
    ].join("");

    return `
      <div class="member-card">
        <h3>${escapeHtml(m.full_name)}</h3>
        <div class="meta">${year}${stream}</div>
        ${courses}
        ${occ}
        ${loc}
        ${bio}
        ${contact}
      </div>
    `;
  }).join("");
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(str) {
  try {
    const u = new URL(str);
    if (u.protocol !== "http:" && u.protocol !== "https:") return "#";
    return escapeHtml(u.href);
  } catch { return "#"; }
}

searchInput.addEventListener("input", renderDirectory);
refreshBtn.addEventListener("click", loadDirectory);
</script>
</body>
</html>
