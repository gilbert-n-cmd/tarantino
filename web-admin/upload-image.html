<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Image - Admin</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif; background:#f9f9f9; margin:0;}
    main{max-width:900px; margin:30px auto; padding:20px; background:#fff; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,.08);}
    h1{color:#004080; margin-top:0;}
    label{font-weight:600;}
    input{width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; margin-top:6px; margin-bottom:14px;}
    button{padding:10px 14px; border:none; border-radius:8px; cursor:pointer; background:#4d749b; color:#fff; font-weight:600;}
    .back{background:transparent; color:#4d749b; border:1px solid #4d749b;}
    #preview{max-width:280px; max-height:280px; display:none; border-radius:12px; margin:10px 0;}
  </style>
</head>
<body>
<header>
  <div class="top-bar">
    <div class="logo" style="color: white; font-size: 24px; font-weight: bold;">Bishop Angelo Tarantino Memorial Secondary School</div>
    <div class="right-section">
      <a class="back" href="admin.html" style="text-decoration:none; padding:8px 12px; border-radius:8px;">← Back</a>
    </div>
  </div>
</header>

<main>
  <h1>Upload Image</h1>

  <label>Choose Image</label>
  <input id="imageFile" type="file" accept="image/*" />

  <!-- preview FIXED -->
  <img id="preview" style="max-width:200px; display:none; margin-top:10px;" />

  <label>Image Title</label>
  <input id="title" type="text" placeholder="Enter image title..." />

  <label>Image Description</label>
  <input id="description" type="text" placeholder="Enter image description..." />

  <button id="saveImage" type="button">Save Image</button>

  <p id="status" style="margin-top:12px; color:#004080; font-weight:600;"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpRkkp6fdlmVQM5xnLsRkRPS5awu0YSmc",
  authDomain: "website-database-d75ea.firebaseapp.com",
  projectId: "website-database-d75ea",
  storageBucket: "website-database-d75ea.appspot.com",
  messagingSenderId: "61842953615",
  appId: "1:61842953615:web:e255cb2ca96184bb0767fa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const fileInput = document.getElementById("imageFile");
const saveBtn = document.getElementById("saveImage");
const status = document.getElementById("status");
const preview = document.getElementById("preview");

// Show preview (this is ONLY local preview on your PC)
fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];

  console.log("Selected file:", file);

  if (!file) {
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});

saveBtn.addEventListener("click", async (e) => {

  const file = fileInput.files?.[0];

  console.log("File object:", file);

  // 🚨 HARD CHECK
  if (!file) {
    status.textContent = "❌ No file selected";
    return;
  }

  if (file.size === 0) {
    status.textContent = "❌ File is empty (0 bytes)";
    return;
  }

  try {
    saveBtn.disabled = true;
    status.textContent = "Uploading...";

    const formData = new FormData();

    // IMPORTANT FIX: include filename
    formData.append("file", file, file.name);
    formData.append("upload_preset", "school_gallery");

    const response = await fetch(
      "https://api.cloudinary.com/v1_1/donjcnxld/image/upload",
      {
        method: "POST",
        body: formData
      }
    );

    const data = await response.json();

    console.log("Cloudinary response:", data);

    if (!response.ok || data.error) {
      throw new Error(data.error?.message || "Upload failed");
    }

    // SAVE TO FIRESTORE
    await addDoc(collection(db, "images"), {
      imageUrl: data.secure_url,
      title: document.getElementById("title").value || "",
      description: document.getElementById("description").value || "",
      createdAt: Date.now()
    });

    status.textContent = "✅ Upload successful!";

    // reset
    fileInput.value = "";
    preview.src = "";
    preview.style.display = "none";

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
  }

  saveBtn.disabled = false;
});
</script>
</body>
</html>
