<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload News - Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif; background:#f9f9f9; margin:0;}
    main{max-width:900px; margin:30px auto; padding:20px; background:#fff; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,.08);}
    h1{color:#004080; margin-top:0;}
    label{font-weight:600;}
    input,textarea{width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; margin-top:6px; margin-bottom:14px;}
    button{padding:10px 14px; border:none; border-radius:8px; cursor:pointer; background:#4d749b; color:#fff; font-weight:600;}
    .row{display:flex; gap:10px; flex-wrap:wrap;}
    .card{background:#f4f7fb; padding:14px; border-radius:12px; width:100%;}
    .back{background:transparent; color:#4d749b; border:1px solid #4d749b;}
  </style>
</head>
<body>
<header>
  <div class="top-bar">
    <div class="logo" style="color: white; font-size: 24px; font-weight: bold;">Bishop Angelo Tarantino Memorial Secondary School</div>
    <div class="right-section">
      <div class="socials-icons img">
        <a href="#footer-icons"><i class="fas fa-globe"></i></a>
        <a href="#footer-icons"><i class="fab fa-instagram"></i></a>
        <a href="#footer-icons"><i class="fab fa-facebook-f"></i></a>
        <a href="#footer-icons"><i class="fab fa-whatsapp"></i></a>
      </div>
      <a class="back" href="admin.html" style="text-decoration:none; padding:8px 12px; border-radius:8px;">← Back</a>
    </div>
  </div>
</header>

<main>
  <h1>Upload News</h1>
  <div class="card">
    <label for="newsTitle">Title</label>
    <input id="newsTitle" type="text" placeholder="Enter news title" required />

    <label for="expiryDate">Expiry Date</label>
<input id="expiryDate" type="date" required />

    <label for="newsContent">Content</label>
    <textarea id="newsContent" rows="6" placeholder="Enter news content" required></textarea>

    <button id="saveNews">Save News</button>
    <p id="status" style="margin-top:12px; color:#004080; font-weight:600;"></p>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpRkkp6fdlmVQM5xnLsRkRPS5awu0YSmc",
    authDomain: "website-database-d75ea.firebaseapp.com",
    databaseURL: "https://website-database-d75ea-default-rtdb.firebaseio.com",
    projectId: "website-database-d75ea",
    storageBucket: "website-database-d75ea.firebasestorage.app",
    messagingSenderId: "61842953615",
    appId: "1:61842953615:web:e255cb2ca96184bb0767fa"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById('saveNews').addEventListener('click', async () => {
  const status = document.getElementById('status');

  const title = document.getElementById('newsTitle').value.trim();
  const content = document.getElementById('newsContent').value.trim();
  const expiryDate = document.getElementById('expiryDate').value;

  if (!title || !content || !expiryDate) {
    status.textContent = '❌ Please fill all fields.';
    return;
  }

  status.textContent = 'Saving...';

  try {
    await addDoc(collection(db, 'news'), {
      title,
      content,
      createdAt: new Date(),
      expiryDate: new Date(expiryDate)
    });

    status.textContent = '✅ News saved successfully.';

    document.getElementById('newsTitle').value = '';
    document.getElementById('newsContent').value = '';
    document.getElementById('expiryDate').value = '';

  } catch (e) {
    console.error(e);
    status.textContent = '❌ Failed to save news.';
  }
});
</script>
</body>
</html>
