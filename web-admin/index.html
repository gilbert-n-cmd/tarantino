<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: #003366;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.login-box{
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 320px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

h2{
  text-align: center;
  color: #003366;
}

input{
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button{
  width: 100%;
  padding: 12px;
  background: #003366;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

button:hover{
  background: #0055aa;
}

#msg{
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="loginAdmin()">Login</button>

  <p id="msg"></p>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyDpRkkp6fdlmVQM5xnLsRkRPS5awu0YSmc",
  authDomain: "website-database-d75ea.firebaseapp.com",
  databaseURL: "https://website-database-d75ea-default-rtdb.firebaseio.com",
  projectId: "website-database-d75ea",
  storageBucket: "website-database-d75ea.firebasestorage.app",
  messagingSenderId: "61842953615",
  appId: "1:61842953615:web:e255cb2ca96184bb0767fa"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Login Function
window.loginAdmin = async function () {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  if (!email || !password) {
    msg.style.color = "red";
    msg.innerText = "Please fill all fields";
    return;
  }

  msg.style.color = "blue";
  msg.innerText = "Logging in...";

  try {

    const userCredential = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = userCredential.user;

    msg.style.color = "green";
    msg.innerText = "Login successful! Redirecting...";

    setTimeout(() => {
      window.location.href = "admin.html";
    }, 1500);

  } catch (error) {

    let errorMessage = "Login failed";

    switch (error.code) {

      case "auth/invalid-email":
        errorMessage = "Invalid email format";
        break;

      case "auth/user-not-found":
        errorMessage = "Admin account not found";
        break;

      case "auth/wrong-password":
        errorMessage = "Wrong password";
        break;

      case "auth/invalid-credential":
        errorMessage = "Invalid email or password";
        break;

      case "auth/too-many-requests":
        errorMessage = "Too many attempts. Try again later";
        break;

      default:
        errorMessage = error.message;
    }

    msg.style.color = "red";
    msg.innerText = errorMessage;
  }
};

// Check Login Status
onAuthStateChanged(auth, (user) => {

  if (user) {
    console.log("Logged in:", user.email);
  } else {
    console.log("No user logged in");
  }

});

// Logout Function (for dashboard page)
window.logoutAdmin = async function () {

  try {

    await signOut(auth);

    window.location.href = "admin-login.html";

  } catch (error) {

    alert(error.message);

  }

};
</script>

</body>
</html>
